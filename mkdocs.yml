# User and contributor guide, published on GitHub Pages (French).
site_name: SuiviEvalLab, documentation
site_description: Logiciel de suivi-évaluation, du cadre de résultats au rapport Word.
site_author: GAYI Komi Selassi, SANOUSSI Moudjibou
site_url: https://jack-junior.github.io/SuiviEvalLab/
repo_url: https://github.com/jack-junior/SuiviEvalLab
repo_name: jack-junior/SuiviEvalLab
edit_uri: edit/main/docs/guide/
copyright: GAYI Komi Selassi et SANOUSSI Moudjibou. Licence GPL-3.0-or-later.
docs_dir: docs/guide
site_dir: build/site
strict: true

theme:
  name: material
  language: fr
  logo: assets/logo.svg
  favicon: assets/favicon.png
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Mode sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Mode clair
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - toc.follow
    - content.action.edit

extra_css:
  - assets/style.css
extra_javascript:
  - assets/zoom.js

extra:
  generator: false

plugins:
  - search:
      lang: fr

markdown_extensions:
  - tables
  - attr_list
  - toc:
      permalink: true
  - pymdownx.superfences

nav:
  - Présentation: index.md
  - Architecture et choix techniques: architecture.md
  - Manuel de l'application:
      - Prise en main et accueil: manuel/accueil.md
      - Fiche du projet: manuel/projet.md
      - Aujourd'hui, agenda et tâches: manuel/quotidien.md
      - Vue d'ensemble et cadre de résultats: manuel/cadre.md
      - Indicateurs: manuel/indicateurs.md
      - Réception et suivi des indicateurs: manuel/suivi.md
      - Activités et budget: manuel/activites.md
      - Redevabilité, apprentissage et évaluations: manuel/redevabilite.md
      - Données: manuel/donnees.md
      - Analyse et tests: manuel/analyse.md
      - Analyses libres: manuel/analyses-libres.md
      - Rapports périodiques et exports: manuel/rapports-periodiques.md
      - Rapport et livrables: manuel/rapport.md
      - Tableau de bord et portefeuille: manuel/portefeuille.md
      - Outils: manuel/outils.md
  - Guides:
      - Guide de l'administrateur: administration.md
      - Guide du partenaire: partenaire.md
      - Installer le serveur relais: serveur.md
      - Protection des données: protection-donnees.md
  - Contribuer: contribuer.md
  - Tester: tester.md
  - Test pilote: recette.md
  - Annexes: annexes.md
  - English:
      - Overview: en/index.md
      - User guide: en/user-guide.md
      - Administrator guide: en/administration.md
      - Partner guide: en/partner.md
      - Installing the relay server: en/server.md
      - Data protection: en/data-protection.md
      - Contributing and testing: en/contributing.md
      - Pilot test: en/pilot.md
