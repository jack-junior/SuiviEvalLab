name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.3"
          use-public-rspm: true

      - name: Install R packages
        run: Rscript -e "p <- readLines('engine/r/packages.txt'); install.packages(p[nzchar(p) & !startsWith(p, '#')])"

      - name: R engine tests
        run: |
          Rscript engine/r/tests/test_proportion.R
          Rscript engine/r/tests/test_estimate.R

      - name: Cache the original survey files
        uses: actions/cache@v4
        with:
          path: build/hdx
          key: hdx-${{ hashFiles('tools/datasets/sources.json') }}

      - name: Download the original survey files (robustness tests)
        run: python tools/datasets/fetch.py build/hdx

      - name: Python engine lint and tests
        working-directory: engine/python
        env:
          SME_FULL_DATA: ${{ github.workspace }}/build/hdx
        run: |
          pip install -r requirements.txt "pytest==9.1.1" "ruff==0.17.0"
          python -m ruff check . ../../tools
          python -m ruff format --check . ../../tools
          python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Desktop app lint, type check and build
        working-directory: apps/desktop
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm run typecheck
          npm run build

  windows:
    name: Windows installer
    runs-on: windows-2022
    needs: lint-and-test
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache embedded runtimes
        uses: actions/cache@v4
        with:
          path: build/cache
          key: runtimes-${{ hashFiles('tools/windows/prepare-runtimes.ps1') }}

      - name: Prepare embedded Python and R
        shell: pwsh
        run: ./tools/windows/prepare-runtimes.ps1

      - name: Smoke test with the embedded engines
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/runtime/engine/python | Out-Null
          Copy-Item -Recurse -Force engine/python/sme_engine build/runtime/engine/python/
          Copy-Item -Recurse -Force engine/r build/runtime/engine/
          python tools/smoke_test.py --python build/runtime/python/python.exe --rscript build/runtime/R/bin/Rscript.exe --rdir build/runtime/engine/r
          $code = $LASTEXITCODE
          Remove-Item -Recurse -Force build/runtime/engine
          if ($code -ne 0) { exit $code }

      - name: Build the installer
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm ci --no-audit --no-fund
          npm run dist:win

      - name: End-to-end test of the installed app
        shell: pwsh
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          npm install --no-save --no-audit --no-fund --no-package-lock playwright@1.64.0
          node tools/e2e/electron-smoke.mjs apps/desktop/release/win-unpacked/SuiviEvalLab.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: build/e2e/*.png
          retention-days: 30

      - name: Installer size
        shell: pwsh
        run: |
          Get-ChildItem apps/desktop/release/*.exe | ForEach-Object { "::notice title=Installer::{0}, {1:N0} MB" -f $_.Name, ($_.Length / 1MB) }

      - uses: actions/upload-artifact@v4
        with:
          name: SuiviEvalLab-installation-windows
          path: apps/desktop/release/*.exe
          retention-days: 30
