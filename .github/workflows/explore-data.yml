name: Explore test data

# Temporary: searches HDX for open survey microdata and commits the report to
# this branch. Runs only on the data/explore branch.

on:
  push:
    branches: ["data/explore"]
    paths: ["tools/datasets/**", ".github/workflows/explore-data.yml"]

permissions:
  contents: write

jobs:
  explore:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download and describe the datasets
        run: |
          set +e
          {
            pip install --quiet --break-system-packages openpyxl==3.1.5
            python3 tools/datasets/fetch_and_describe.py datasets/raw
            echo "exit code $?"
          } > tools/datasets/run.log 2>&1
          tail -n 20 tools/datasets/run.log | while read -r l; do echo "::notice title=log::$l"; done
          exit 0
      - name: Commit the report
        if: always()
        run: |
          git config user.name "gayi komi selassi"
          git config user.email "43295042+jack-junior@users.noreply.github.com"
          git add -A tools/datasets datasets
          git commit -m "chore(data): test datasets and structure report" || exit 0
          git push
