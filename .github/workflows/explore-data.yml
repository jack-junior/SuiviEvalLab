name: Explore test data

# Temporary: searches HDX for open survey microdata and commits the report to
# this branch. Runs only on the data/explore branch.

on:
  push:
    branches: ["data/explore"]
    paths: ["tools/datasets/**", ".github/workflows/explore-data.yml"]

permissions:
  contents: write

jobs:
  explore:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Search HDX
        run: python3 tools/datasets/explore_hdx.py tools/datasets/hdx-candidates.md
      - name: Commit the report
        run: |
          git config user.name "gayi komi selassi"
          git config user.email "43295042+jack-junior@users.noreply.github.com"
          git add tools/datasets/hdx-candidates.md
          git commit -m "chore(data): HDX candidate report" || exit 0
          git push
