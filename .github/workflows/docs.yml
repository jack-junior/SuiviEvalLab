name: Documentation

# Builds the guide (docs/guide, MkDocs) and publishes it on GitHub Pages when
# main changes. Pull requests only build it, so a broken link or page fails early.

on:
  push:
    branches: [main]
    paths: ["docs/guide/**", "mkdocs.yml", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/guide/**", "mkdocs.yml", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build the site
        run: |
          pip install "mkdocs==1.6.1" "mkdocs-material==9.7.7"
          mkdocs build --strict
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
