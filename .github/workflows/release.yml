name: Release

# Publishes a GitHub release when a version tag (v0.1.0, v0.2.0, ...) is pushed.
# The installer is built, smoke-tested and end-to-end tested here, then
# attached to the release with its SHA-256 checksum. Versions below 1.0 are
# marked as pre-releases.
#
# To retry a failed release without moving the tag, run this workflow by hand
# from the Actions tab and enter the existing tag (for example v0.1.0).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to publish, for example v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the Windows installer
    runs-on: windows-2022
    env:
      PYTHONUTF8: "1"
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Cache embedded runtimes
        uses: actions/cache@v5
        with:
          path: build/cache
          key: runtimes-${{ hashFiles('tools/windows/prepare-runtimes.ps1') }}

      - name: Prepare embedded Python and R
        shell: pwsh
        run: ./tools/windows/prepare-runtimes.ps1

      - name: Smoke test with the embedded engines
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/runtime/engine/python | Out-Null
          Copy-Item -Recurse -Force engine/python/sme_engine build/runtime/engine/python/
          Copy-Item -Recurse -Force engine/r build/runtime/engine/
          python tools/smoke_test.py --python build/runtime/python/python.exe --rscript build/runtime/R/bin/Rscript.exe --rdir build/runtime/engine/r
          $code = $LASTEXITCODE
          Remove-Item -Recurse -Force build/runtime/engine
          if ($code -ne 0) { exit $code }

      - name: Build the installer
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm ci --no-audit --no-fund
          npm run dist:win

      - name: End-to-end test of the installed app
        shell: pwsh
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          npm install --no-save --no-audit --no-fund --no-package-lock playwright@1.64.0
          node tools/e2e/electron-smoke.mjs apps/desktop/release/win-unpacked/SuiviEvalLab.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check that the tag matches the app version
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:RELEASE_TAG) {
            Write-Error "Tag $env:RELEASE_TAG does not match package.json version $version"
            exit 1
          }

      # Bash (Git Bash on the Windows runner) rather than PowerShell: a failing
      # native command can stop a PowerShell step before its error is reported.
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set +e  # the default bash shell uses -e, which would skip the error report
          fail() { echo "::error title=Release::$1"; exit 1; }
          run() {
            out=$("$@" 2>&1); code=$?
            echo "$out"
            [ $code -eq 0 ] || fail "$1 $2 $3 (exit $code): $(echo "$out" | tr '\r\n' '  ' | cut -c1-900)"
          }

          tag="$RELEASE_TAG"
          version="${tag#v}"
          echo "::notice title=gh::$(gh --version | head -n1)"

          exe=$(ls apps/desktop/release/*.exe 2>/dev/null | head -n1)
          [ -n "$exe" ] || fail "No installer found in apps/desktop/release"
          name=$(basename "$exe")
          (cd "$(dirname "$exe")" && sha256sum "$name") > SHA256SUMS.txt || fail "sha256sum failed"
          # The notes template is read from the commit of this workflow run, so a
          # manual retry of an older tag still uses the current template.
          gh api "repos/$REPO/contents/.github/release-notes.md?ref=$GITHUB_SHA" \
            -H "Accept: application/vnd.github.raw" > notes-template.md \
            || fail "Cannot read .github/release-notes.md at $GITHUB_SHA"
          sed "s/<version>/$version/g" notes-template.md > notes.md || fail "Cannot write the release notes"

          if gh release view "$tag" --repo "$REPO" > /dev/null 2>&1; then
            echo "::notice title=Release::$tag already exists, uploading the installer again"
            run gh release upload "$tag" "$exe" SHA256SUMS.txt --repo "$REPO" --clobber
          else
            flags=()
            case "$version" in 0.*) flags+=(--prerelease) ;; esac
            run gh release create "$tag" "$exe" SHA256SUMS.txt --repo "$REPO" --verify-tag \
              --title "SuiviEvalLab $version" --notes-file notes.md "${flags[@]}"
          fi
          echo "::notice title=Release::$tag published, $name, sha256 $(cut -d' ' -f1 SHA256SUMS.txt)"
