name: Release

# Publishes a GitHub release when a version tag (v0.1.0, v0.2.0, ...) is pushed.
# The installer is built, smoke-tested and end-to-end tested here, then
# attached to the release with its SHA-256 checksum. Versions below 1.0 are
# marked as pre-releases.
#
# To retry a failed release without moving the tag, run this workflow by hand
# from the Actions tab and enter the existing tag (for example v0.1.0).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to publish, for example v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the Windows installer
    runs-on: windows-2022
    env:
      PYTHONUTF8: "1"
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache embedded runtimes
        uses: actions/cache@v4
        with:
          path: build/cache
          key: runtimes-${{ hashFiles('tools/windows/prepare-runtimes.ps1') }}

      - name: Prepare embedded Python and R
        shell: pwsh
        run: ./tools/windows/prepare-runtimes.ps1

      - name: Smoke test with the embedded engines
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/runtime/engine/python | Out-Null
          Copy-Item -Recurse -Force engine/python/sme_engine build/runtime/engine/python/
          Copy-Item -Recurse -Force engine/r build/runtime/engine/
          python tools/smoke_test.py --python build/runtime/python/python.exe --rscript build/runtime/R/bin/Rscript.exe --rdir build/runtime/engine/r
          $code = $LASTEXITCODE
          Remove-Item -Recurse -Force build/runtime/engine
          if ($code -ne 0) { exit $code }

      - name: Build the installer
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm ci --no-audit --no-fund
          npm run dist:win

      - name: End-to-end test of the installed app
        shell: pwsh
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          npm install --no-save --no-audit --no-fund --no-package-lock playwright@1.64.0
          node tools/e2e/electron-smoke.mjs apps/desktop/release/win-unpacked/SuiviEvalLab.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check that the tag matches the app version
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:RELEASE_TAG) {
            Write-Error "Tag $env:RELEASE_TAG does not match package.json version $version"
            exit 1
          }

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:RELEASE_TAG
          $version = $tag.TrimStart("v")
          $repo = "${{ github.repository }}"
          $exe = Get-ChildItem apps/desktop/release/*.exe | Select-Object -First 1
          if (-not $exe) { "::error title=Release::No installer found in apps/desktop/release"; exit 1 }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Out-File -Encoding ascii SHA256SUMS.txt
          (Get-Content .github/release/notes.md -Raw).Replace("<version>", $version) | Out-File -Encoding utf8 notes.md

          # Every gh failure is reported as an annotation, readable without the raw logs.
          function Invoke-Gh {
            $out = & gh @args 2>&1
            $code = $LASTEXITCODE
            $out | ForEach-Object { Write-Host $_ }
            if ($code -ne 0) {
              $msg = ($out | Out-String).Trim() -replace "`r?`n", " | "
              "::error title=gh $($args[0]) $($args[1])::exit $code, $msg"
              exit $code
            }
          }

          $existing = gh release view $tag --repo $repo --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            "::notice title=Release::$tag already exists, uploading the installer again"
            Invoke-Gh release upload $tag $exe.FullName SHA256SUMS.txt --repo $repo --clobber
          } else {
            $flags = @()
            if ($version.StartsWith("0.")) { $flags += "--prerelease" }
            Invoke-Gh release create $tag $exe.FullName SHA256SUMS.txt --repo $repo --verify-tag --title "SuiviEvalLab $version" --notes-file notes.md @flags
          }
          "::notice title=Release::$tag published, $($exe.Name), sha256 $hash"
