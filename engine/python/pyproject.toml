[project]
name = "sme-engine"
version = "0.1.0"
description = "Moteur métier de SuiviEvalLab"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "polars==2.0.0",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "ruff==0.17.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
