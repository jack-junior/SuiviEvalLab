appId: org.suivievallab.app
productName: SuiviEvalLab
copyright: Licence GPL-3.0-or-later
directories:
  output: release
  buildResources: build-resources
files:
  - dist/**/*
  - package.json
asar: true
# Automatic updates read the GitHub releases (latest.yml, installer and block map).
# The release workflow uploads these files itself; electron-builder only writes them.
publish:
  provider: github
  owner: jack-junior
  repo: SuiviEvalLab
extraResources:
  # Embedded Python (prepared by tools/windows/prepare-runtimes.ps1)
  - from: ../../build/runtime/python
    to: python
  # Embedded R with its packages
  - from: ../../build/runtime/R
    to: R
  # Python business engine
  - from: ../../engine/python/sme_engine
    to: engine/python/sme_engine
    filter:
      - "**/*.py"
      - "examples/*.xlsx"
  # R statistical engine
  - from: ../../engine/r
    to: engine/r
    filter:
      - worker.R
      - R/*.R
win:
  icon: build-resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: SuiviEvalLab
  artifactName: SuiviEvalLab-${version}-installation.exe
  unicode: true
  # Block map of the installer: an update downloads only the blocks that changed.
  differentialPackage: true
  installerIcon: build-resources/icon.ico
  uninstallerIcon: build-resources/icon.ico
